    };
    function icon(name, size = 16) {
      return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ICONS.about}</svg>`;
    }
    const dirIcon = (size = 13) => `<span class="dir-icon" aria-hidden="true">${icon('arrow', size)}</span>`;
    const NAV = [
      { id: 'home', icon: 'home' }, { id: 'skills', icon: 'skills' }, { id: 'sessions', icon: 'sessions' },
      { id: 'wallet', icon: 'wallet' }, { id: 'safety', icon: 'safety' }, { id: 'admin', icon: 'admin' },
      { id: 'about', icon: 'about' }
    ];
    const MODULE_ROUTES = ['skills', 'sessions', 'wallet', 'safety', 'admin'];
    const VALID_ROUTES = [...NAV.map(item => item.id), 'room'];
    const localeMap = { ar: 'ar-MA', en: 'en-GB', fr: 'fr-FR', zgh: 'en-GB' };

    function loadDB() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          const valid = parsed && typeof parsed === 'object' &&
            Array.isArray(parsed.sessions) && Array.isArray(parsed.transactions) && Array.isArray(parsed.reports);
          if (valid) {
            if (!LANGS.some(lang => lang.code === parsed.lang)) parsed.lang = 'ar';
            return parsed;
          }
        }
      } catch (error) {
        console.warn('Mahara: saved demo data could not be read.', error);
      }
      return defaultDB();
    }
    let db = loadDB();
    let currentLang = LANGS.some(lang => lang.code === db.lang) ? db.lang : 'ar';
    let route = VALID_ROUTES.includes((location.hash || '').replace('#/', '')) ? (location.hash || '').replace('#/', '') : 'home';
    const filters = { search: '', category: 'all', level: 'all', sort: 'recommended' };
    let sessionsFilter = 'all';
    let adminFilter = 'open';
    let pendingConfirm = null;
    let lastFocused = null;

    function saveDB() {
      try {
        db.lang = currentLang;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
        return true;
      } catch (error) {
        toast(t('toast.storageError'), 'error');
        return false;
      }
    }
    function t(key) {
      return (I18N[currentLang] && I18N[currentLang][key]) ?? I18N.ar[key] ?? I18N.en[key] ?? key;
    }
    function tf(key, values = {}) {
      return t(key).replace(/\{(\w+)\}/g, (match, name) => Object.prototype.hasOwnProperty.call(values, name) ? String(values[name]) : match);
    }
    
      function sanitizeInput(str, maxLen = 500) {
        if (typeof str !== 'string') return '';
        return str.trim().replace(/<[^>]*>?/gm, '').slice(0, maxLen);
      }

      function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
    }
    function formatN(value) {
      try { return new Intl.NumberFormat(localeMap[currentLang] || 'en-GB').format(Number(value) || 0); }
      catch (error) { return String(Number(value) || 0); }
    }
    function formatDate(value) {
      if (!value) return '—';
      try {
        return new Intl.DateTimeFormat(localeMap[currentLang] || 'en-GB', { day: 'numeric', month: 'short', year: 'numeric' }).format(new Date(`${value}T12:00:00`));
      } catch (error) { return value; }
    }
    function isoToday() {
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      return now.toISOString().slice(0, 10);
    }
    function addDays(days) {
      const date = new Date();
      date.setDate(date.getDate() + days);
      date.setMinutes(date.getMinutes() - date.getTimezoneOffset());
      return date.toISOString().slice(0, 10);
    }
    function makeId(prefix) {
      return `${prefix}-${Date.now().toString(36).slice(-5)}${Math.floor(Math.random() * 90 + 10)}`;
    }
    function skillTitle(skill) { return skill ? (skill.title[currentLang] || skill.title.ar) : '—'; }
    function skillDesc(skill) { return skill ? (skill.desc[currentLang] || skill.desc.ar) : ''; }
    function creditsLabel(value) { return `${formatN(value)} ${t('credits')}`; }
    function categoryLabel(key) { return t(`cats.${key}`); }
    function levelLabel(key) { return t(`levels.${key}`); }
    function reasonLabel(key) { return t(`reason.${key}`); }
    function statusLabel(key) { return t(`status.${key}`); }
    function truncate(text, length = 28) { return text.length > length ? `${text.slice(0, length).trim()}…` : text; }
    function getBalance() { return db.transactions.reduce((sum, tx) => sum + Number(tx.amount || 0), 0); }
    function getHeld() { return db.sessions.filter(item => ['pending', 'confirmed'].includes(item.status)).reduce((sum, item) => sum + Number(item.credits || 0), 0); }
    function getStats() {
      const balances = db.transactions.reduce((sum, tx) => sum + Number(tx.amount || 0), 0);
      const added = db.transactions.filter(tx => tx.amount > 0).reduce((sum, tx) => sum + Number(tx.amount), 0);
      const spent = Math.abs(db.transactions.filter(tx => tx.amount < 0).reduce((sum, tx) => sum + Number(tx.amount), 0));
      return {
        skillsTotal: SKILLS.length,
        skillsAvailable: SKILLS.filter(skill => skill.available).length,
        categories: new Set(SKILLS.map(skill => skill.category)).size,
        sessionsTotal: db.sessions.length,
        pending: db.sessions.filter(item => item.status === 'pending').length,
        confirmed: db.sessions.filter(item => item.status === 'confirmed').length,
        completed: db.sessions.filter(item => item.status === 'completed').length,
        cancelled: db.sessions.filter(item => item.status === 'cancelled').length,
        active: db.sessions.filter(item => ['pending', 'confirmed'].includes(item.status)).length,
        reportsTotal: db.reports.length,
        reportsOpen: db.reports.filter(report => report.status === 'open').length,
        reportsResolved: db.reports.filter(report => report.status === 'resolved').length,
        reportsDismissed: db.reports.filter(report => report.status === 'dismissed').length,
        balance: balances, added, spent, held: getHeld(), txCount: db.transactions.length
      };
    }
    function sessionCost(skill, minutes) {
      if (!skill) return 0;
      return Math.max(5, Math.round((skill.credits * Number(minutes)) / skill.minutes / 5) * 5);
    }
    function activeSessions() {
      return [...db.sessions].filter(item => ['pending', 'confirmed'].includes(item.status))
        .sort((a, b) => `${a.date} ${a.time}`.localeCompare(`${b.date} ${b.time}`));
    }
    function txKind(tx) {
      if (tx.amount > 0) return 'in';
      return tx.type === 'hold' ? 'held' : 'out';
    }
    function txDescription(tx) {
      const skill = tx.skillId ? SKILL_MAP[tx.skillId] : null;
      const skillName = skill ? skillTitle(skill) : '—';
      if (tx.type === 'grant') return t('wallet.txGrant');
      if (tx.type === 'topup') return t('wallet.txTopup');
      if (tx.type === 'reward') return t('wallet.txReward');
      if (tx.type === 'hold') return tf('wallet.txHoldFor', { skill: skillName });
      if (tx.type === 'refund') return tf('wallet.txRefundFor', { skill: skillName });
      return tf('wallet.txSpendFor', { skill: skillName });
    }
    function txTypeLabel(tx) {
      if (tx.amount > 0) return t('wallet.typeIn');
      return tx.type === 'hold' ? t('wallet.typeHeld') : t('wallet.typeOut');
    }
    function pageHead(kicker, title, subtitle, actions = '') {
      return `<div class="page-head">
        <div class="page-head-copy">
          <span class="kicker">${esc(kicker)}</span>
          <h1>${esc(title)}</h1>
          <p>${esc(subtitle)}</p>
        </div>
        ${actions ? `<div class="page-actions">${actions}</div>` : ''}
      </div>`;
    }
    function demoNotice(short = true) {
      return `<div class="banner" role="note">
        ${icon('alert', 16)}
        <span><strong>${esc(t('notice.title'))}</strong> — ${esc(t(short ? 'notice.short' : 'notice.body'))}</span>
        <button class="text-button" data-go="about">${esc(t('notice.details'))}</button>
      </div>`;
    }
    function syncChrome() {
      const lang = LANGS.find(item => item.code === currentLang) || LANGS[0];
      document.documentElement.lang = currentLang;
      document.documentElement.dir = lang.dir;
      document.title = `${t('brand')} — ${t('tagline')}`;
      document.getElementById('brandName').textContent = t('brand');
        const homeTxt = document.getElementById('topbarHomeText');
        if (homeTxt) homeTxt.textContent = t('nav.home');
      document.getElementById('brandTagline').textContent = t('tagline');
      document.getElementById('sideNewRequestText').textContent = t('requestNew');
      document.getElementById('sideNavLabel').textContent = t('side.workspace');
      document.getElementById('sideProfileName').textContent = t('profile.name');
      document.getElementById('sideProfileRole').textContent = t('profile.role');
      document.getElementById('sideDemoText').textContent = t('side.demo');
      const initial = currentLang === 'ar' || currentLang === 'zgh' ? 'س' : 'S';
      document.getElementById('sideProfileAvatar').textContent = initial;
      document.querySelectorAll('#profileButton .avatar, .topbar #profileButton .avatar').forEach(node => { node.textContent = initial; });
      document.getElementById('profileName').textContent = t('profile.name');
      document.getElementById('profileRole').textContent = t('demoAccount');
      document.getElementById('crumbBrand').textContent = t('brand');
      document.getElementById('crumbCurrent').textContent = t(`nav.${route}`);
      document.getElementById('langButtonLabel').textContent = lang.name;
      document.getElementById('langButton').title = t('language');
      document.getElementById('langButton').setAttribute('aria-label', `${t('language')}: ${lang.name}`);
      document.getElementById('topBalanceAmount').textContent = formatN(getBalance());
      document.getElementById('topBalanceLabel').textContent = t('credits');
      document.getElementById('topBalance').title = `${t('nav.wallet')}: ${creditsLabel(getBalance())}`;
      document.getElementById('profileButton').title = t('demoAccount');
      document.getElementById('sideProfileRole').title = t('localOnly');
      document.getElementById('footerNote').textContent = t('footer.note');
      document.getElementById('footerAbout').textContent = t('footer.about');
      document.getElementById('skipLink').textContent = { ar: 'تخطي إلى المحتوى', en: 'Skip to content', fr: 'Aller au contenu', zgh: 'ⵣⵓⵍ ⵖⵔ ⵓⴷⵔⵉⵙ' }[currentLang];
      document.getElementById('menuToggle').setAttribute('aria-label', t('menu'));
      document.getElementById('sidebarClose').setAttribute('aria-label', t('close'));
      document.getElementById('sidebar').setAttribute('aria-label', t('side.workspace'));
      const s = getStats();
      document.getElementById('sideNav').innerHTML = NAV.map(item => {
        const badge = item.id === 'skills' ? s.skillsTotal : item.id === 'sessions' ? s.active : item.id === 'admin' ? s.reportsOpen : null;
        return `<a class="nav-item ${route === item.id ? 'active' : ''}" href="#/${item.id}" ${route === item.id ? 'aria-current="page"' : ''} data-go="${item.id}">
          ${icon(item.icon, 18)}<span class="nav-text">${esc(t(`nav.${item.id}`))}</span>
          ${badge !== null ? `<span class="nav-badge">${formatN(badge)}</span>` : ''}
        </a>`;
      }).join('');
      const langMenu = document.getElementById('langMenu');
      langMenu.setAttribute('aria-label', t('language'));
      langMenu.innerHTML = `<div class="lang-pop-head">${esc(t('language'))} · 4</div>` + LANGS.map(item => `
        <button class="lang-option" role="menuitem" type="button" data-lang="${item.code}" aria-pressed="${item.code === currentLang}">
          <span class="lang-glyph" style="font-family:${item.font}">${item.glyph}</span>
          <span class="lang-copy"><strong>${esc(item.name)}</strong><small>${esc(item.english)} · ${item.dir.toUpperCase()}</small></span>
          ${item.code === currentLang ? `<span class="lang-check">${icon('check', 14)}</span>` : ''}
        </button>`).join('');
    }
  </script>
  <script>
    /* ============================================================
       Shared view components
       ============================================================ */
    function statusBadge(status) {
      const cls = { pending: 'badge-amber', confirmed: 'badge-green', completed: 'badge-blue', cancelled: 'badge-dot', open: 'badge-red', resolved: 'badge-green', dismissed: 'badge-dot' }[status] || '';
      return `<span class="badge ${cls}">${esc(statusLabel(status))}</span>`;
    }
    function emptyState(title, body, action = '', iconName = 'sessions') {
      return `<div class="empty-state">
        <span class="empty-icon">${icon(iconName, 20)}</span>
        <strong>${esc(title)}</strong><p>${esc(body)}</p>${action}
      </div>`;
    }
    function moduleCard(item) {
      const descriptions = {
        skills: 'module.skills.desc', sessions: 'module.sessions.desc', wallet: 'module.wallet.desc',
        safety: 'module.safety.desc', admin: 'module.admin.desc'
      };
      return `<a class="module-card" href="#/${item.route}" data-go="${item.route}">
        <span class="module-icon ${item.tone || ''}">${icon(item.icon, 17)}</span>
        <h3>${esc(t(`nav.${item.route}`))}</h3>
        <p>${esc(t(descriptions[item.route]))}</p>
        <span class="module-foot"><strong>${esc(item.meta)}</strong><span>${esc(t('viewSection'))} ${dirIcon(13)}</span></span>
      </a>`;
    }
    function statCardHTML(item) {
      const ratio = Math.max(0, Math.min(100, Number(item.ratio) || 0));
      return `<button type="button" class="stat-card stat-link" data-go="${item.route}" aria-label="${esc(`${item.label}: ${item.value}`)}">
        <span class="stat-top"><span class="stat-label">${esc(item.label)}</span><span class="stat-icon ${item.tone || ''}">${icon(item.icon, 15)}</span></span>
        <span class="stat-value">${esc(item.value)}${item.suffix ? `<small>${esc(item.suffix)}</small>` : ''}</span>
        <span class="stat-note">${esc(item.note)}</span>
        <span class="stat-meter"><i class="${item.tone || ''}" style="width:${ratio}%"></i></span>
      </button>`;
    }
    function skillCardHTML(skill) {
      const category = categoryLabel(skill.category);
      return `<article class="skill-card">
        <figure class="skill-image">
          <img src="${skill.image}" alt="${esc(skillTitle(skill))}" loading="lazy" decoding="async">
          <div class="skill-image-top">
            <span class="badge">${esc(category)}</span>
            <span class="badge availability ${skill.available ? '' : 'badge-red'}">${esc(skill.available ? t('skills.availableNow') : t('unavailable'))}</span>
          </div>
          <div class="skill-image-bottom">
            <span>${esc(levelLabel(skill.level))} · ${formatN(skill.minutes)} ${esc(t('minutes'))}</span>
            <span class="skill-credit">${formatN(skill.credits)} <small>${esc(t('credits'))}</small></span>
          </div>
        </figure>
        <div class="skill-body">
          <div class="skill-owner"><span class="owner-avatar">${esc(skill.owner.charAt(0))}</span><span>${esc(tf('skills.by', { owner: skill.owner }))}</span></div>
          <h3>${esc(skillTitle(skill))}</h3>
          <p class="skill-desc">${esc(skillDesc(skill))}</p>
          <div class="skill-meta">
            <span>${icon('tag', 11)}${esc(category)}</span>
            <span>${icon('clock', 11)}${formatN(skill.minutes)} ${esc(t('minutes'))}</span>
            <span>${icon('layers', 11)}${esc(levelLabel(skill.level))}</span>
          </div>
          <div class="skill-actions">
            <button type="button" class="btn btn-primary btn-small" data-action="new-request" data-skill="${skill.id}" ${skill.available ? '' : `disabled title="${esc(t('skills.unavailableNote'))}"`}>
              ${icon('plus', 13)}${esc(skill.available ? t('skills.request') : t('unavailable'))}
            </button>
            <button type="button" class="btn btn-secondary btn-small" data-action="skill-detail" data-skill="${skill.id}">
              ${esc(t('details'))}
            </button>
            <button type="button" class="btn btn-secondary btn-icon btn-small report-icon" data-action="report" data-skill="${skill.id}" aria-label="${esc(t('skills.report'))}" title="${esc(t('skills.report'))}">
              ${icon('flag', 13)}
            </button>
          </div>
        </div>
      </article>`;
    }
    function filteredSkills() {
      const needle = filters.search.trim().toLocaleLowerCase();
      let list = SKILLS.filter(skill => {
        const haystack = `${skillTitle(skill)} ${skillDesc(skill)} ${skill.owner} ${categoryLabel(skill.category)} ${levelLabel(skill.level)}`.toLocaleLowerCase();
        return (!needle || haystack.includes(needle)) &&
          (filters.category === 'all' || skill.category === filters.category) &&
          (filters.level === 'all' || skill.level === filters.level);
      });
      if (filters.sort === 'credits') list = [...list].sort((a, b) => a.credits - b.credits);
      if (filters.sort === 'duration') list = [...list].sort((a, b) => a.minutes - b.minutes);
      if (filters.sort === 'recommended') list = [...list].sort((a, b) => Number(b.available) - Number(a.available));
      return list;
    }
    function skillGridMarkup() {
      const list = filteredSkills();
      if (!list.length) {
        return emptyState(t('skills.noResultsTitle'), t('skills.noResultsDesc'),
          `<button type="button" class="btn btn-secondary btn-small" data-action="reset-filters">${t('skills.resetFilters')}</button>`, 'search');
      }
      return list.map(skillCardHTML).join('');
    }
    function optionsMarkup(values, current, label) {
      return values.map(value => `<option value="${value}" ${value === current ? 'selected' : ''}>${esc(label(value))}</option>`).join('');
    }
    function activeUpcomingMarkup(limit = 3) {
      const items = activeSessions().slice(0, limit);

      return `<div class="upcoming-list">${items.map(item => {

    function sessionCardHTML(item) {
      const skill = SKILL_MAP[item.skillId] || SKILLS[0];

        actions += `<button type="button" class="btn btn-green" data-action="session-confirm" data-id="${item.id}">${icon('check', 13)}${esc(t('sessions.actionConfirm'))}</button>`;

        actions += `<button type="button" class="btn btn-danger-soft" data-action="session-cancel" data-id="${item.id}">${esc(t('sessions.actionCancel'))}</button>`;

        actions += `<button type="button" class="btn btn-secondary" data-action="session-rebook" data-skill="${skill.id}">${icon('refresh', 13)}${esc(t('sessions.actionRebook'))}</button>`;

    function showModal(title, subtitle, body, opts = {}) {
      lastFocused = document.activeElement;
      const root = document.getElementById('modalRoot');
      root.innerHTML = `<div class="modal-backdrop" data-modal-backdrop>
        <section class="modal ${opts.wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="${subtitle ? 'modalSubtitle' : ''}">
          <header class="modal-header">
            <div><h2 id="modalTitle">${esc(title)}</h2>${subtitle ? `<p id="modalSubtitle">${esc(subtitle)}</p>` : ''}</div>
            <button type="button" class="modal-close" data-close-modal aria-label="${esc(t('close'))}" title="${esc(t('close'))}">×</button>
          </header>
          <div class="modal-body">${body}</div>
        </section>
      </div>`;
      document.body.style.overflow = 'hidden';
      setTimeout(() => {
        const target = root.querySelector('input:not([type="checkbox"]), select, textarea, button');
        if (target) target.focus({ preventScroll: true });
      }, 40);
    }
    function closeModal() {
      document.getElementById('modalRoot').innerHTML = '';
      document.body.style.overflow = '';
      if (lastFocused && typeof lastFocused.focus === 'function') {
        try { lastFocused.focus({ preventScroll: true }); } catch (error) { /* no-op */ }
      }
      lastFocused = null;
      pendingConfirm = null;
    }
    function requestSummaryHTML(skill, minutes) {

      return `<div class="cost-preview">

        <div style="text-align:end"><span>${esc(t('sessions.formBalance'))}</span><strong>${creditsLabel(balance)}</strong></div>
        <div style="text-align:end"><span>${esc(t('sessions.formAfter'))}</span><strong>${creditsLabel(Math.max(0, after))}</strong></div>
      </div>
      <div id="requestWarning">${after < 0 ? `<div class="alert alert-red" style="margin-top:9px;font-size:9.5px">${esc(t('sessions.formInsufficient'))} <button type="button" class="text-button danger" data-action="new-request" data-close-modal>${esc(t('hero.manage'))}</button></div>` : ''}</div>`;
    }

              ${[30, 45, 60, 90].map(value => `<option value="${value}" ${value === minutes ? 'selected' : ''}>${formatN(value)} ${esc(t('minutes'))}</option>`).join('')}

          </div>
          <div class="field">
            <label>${esc(t('sessions.formBalance'))}</label>
            <div class="input" style="display:flex;align-items:center;background:#f8f9f3;color:var(--green);font-weight:600">${creditsLabel(getBalance())}</div>
          </div>
          <div class="field full">
            <label for="requestNote">${esc(t('sessions.formNote'))} <span style="font-weight:400;color:var(--muted)">· ${esc(t('sessions.formNoteHint'))}</span></label>

            <div id="requestErrors" class="field-error" role="alert"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-close-modal>${esc(t('cancel'))}</button>
          <button type="submit" class="btn btn-primary">${icon('plus', 14)}${esc(t('sessions.formSubmit'))}</button>
        </div>
      </form>`;
      showModal(t('sessions.formTitle'), t('sessions.formSub'), body, { wide: true });
      updateRequestSummary();
    }
    function updateRequestSummary() {
      const form = document.getElementById('requestForm');
      const summary = document.getElementById('requestSummary');
      if (!form || !summary) return;
      const selected = SKILL_MAP[form.elements.skill.value];
      const minutes = Number(form.elements.duration.value);
      if (!selected) return;
      summary.innerHTML = requestSummaryHTML(selected, minutes);
      const cost = sessionCost(selected, minutes);
      const submit = form.querySelector('button[type="submit"]');
      if (submit) submit.disabled = getBalance() < cost || !selected.available;
      const warning = document.getElementById('requestWarning');
      if (warning && getBalance() < cost) {
        const button = document.createElement('button');
        button.type = 'button'; button.className = 'text-button danger'; button.dataset.go = 'wallet'; button.textContent = t('hero.manage');
        warning.querySelector('.text-button')?.replaceWith(button);
      }
    }

    function playPartnerVoice(text) {
      if (!text) return;
      roomState.peerSpeaking = true;
      updateSpeakingVisuals(true);

      // Web Audio tone for authentic audio feedback
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          const actx = new AudioCtx();
          const osc = actx.createOscillator();
          const gain = actx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(320, actx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(440, actx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.08, actx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.4);
          osc.connect(gain);
          gain.connect(actx.destination);
          osc.start();
          osc.stop(actx.currentTime + 0.4);
        }
      } catch(e) {}

      // SpeechSynthesis for Arabic voice pronunciation
      if ('speechSynthesis' in window) {
        try {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'ar-SA';
          utterance.rate = 1.0;
          utterance.pitch = 0.95;
          const voices = window.speechSynthesis.getVoices();
          const ar = voices.find(v => v.lang.startsWith('ar') || v.lang.includes('AR'));
          if (ar) utterance.voice = ar;

          utterance.onend = () => {
            roomState.peerSpeaking = false;
            updateSpeakingVisuals(false);
          };
          utterance.onerror = () => {
            roomState.peerSpeaking = false;
            updateSpeakingVisuals(false);
          };
          window.speechSynthesis.speak(utterance);
        } catch(e) {
          setTimeout(() => {
            roomState.peerSpeaking = false;
            updateSpeakingVisuals(false);
          }, 3000);
        }
      } else {
        setTimeout(() => {
          roomState.peerSpeaking = false;
          updateSpeakingVisuals(false);
        }, 3000);
      }
    }

      const waves = document.querySelectorAll('.peer-speech-wave');

    function playSwitchChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.15);
        osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.35);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 1.2);
      } catch (e) {
        console.warn('Audio chime:', e);
      }
    }

  <script>
    /* ============================================================
       Global interaction layer
       ============================================================ */
    function toast(message, type = 'success') {
      const root = document.getElementById('toastRoot');
      const node = document.createElement('div');
      node.className = `toast ${type === 'error' ? 'error' : type === 'warn' ? 'warn' : ''}`;
      node.innerHTML = `${icon(type === 'error' ? 'x' : type === 'warn' ? 'alert' : 'checkCircle', 15)}<span>${esc(message)}</span>`;
      root.appendChild(node);
      const live = document.getElementById('liveRegion');
      live.textContent = '';
      setTimeout(() => { live.textContent = message; }, 30);
      setTimeout(() => {
        node.classList.add('out');
        setTimeout(() => node.remove(), 240);
      }, 4300);
    }
    function openSidebar() {
      document.getElementById('sidebar').classList.add('open');
      document.getElementById('sidebarBackdrop').classList.add('show');
      document.getElementById('menuToggle').setAttribute('aria-expanded', 'true');
      const closeButton = document.getElementById('sidebarClose');
      closeButton.style.display = 'grid';
      closeButton.focus({ preventScroll: true });
    }
    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebarBackdrop').classList.remove('show');
      document.getElementById('menuToggle').setAttribute('aria-expanded', 'false');
      const closeButton = document.getElementById('sidebarClose');
      if (closeButton) closeButton.style.display = 'none';
    }
    function closeLangMenu() {
      const menu = document.getElementById('langMenu');
      if (!menu) return;
      menu.hidden = true;
      document.getElementById('langButton').setAttribute('aria-expanded', 'false');
    }
    function toggleLangMenu() {
      const menu = document.getElementById('langMenu');
      const willOpen = menu.hidden;
      menu.hidden = !willOpen;
      document.getElementById('langButton').setAttribute('aria-expanded', String(willOpen));
      if (willOpen) {
        const first = menu.querySelector('[data-lang]');
        if (first) setTimeout(() => first.focus({ preventScroll: true }), 20);
      }
    }
    function setLanguage(code) {
      const lang = LANGS.find(item => item.code === code);
      if (!lang) return;
      const changed = code !== currentLang;
      closeModal();
      closeLangMenu();
      currentLang = code;
      db.lang = code;
      if (changed) {
        saveDB();
        renderApp();
        toast(t('toast.language'));
      }
      const langButton = document.getElementById('langButton');
      if (langButton) langButton.focus({ preventScroll: true });
    }
    function routeFromHash() {
      const value = (location.hash || '').replace(/^#\/?/, '');
      return VALID_ROUTES.includes(value) ? value : 'home';
    }
    function skillIdOf(element) {
      return element && element.getAttribute ? (element.getAttribute('data-skill') || '') : '';
    }

    document.getElementById('langButton').addEventListener('click', event => {
      event.stopPropagation();
      toggleLangMenu();
    });

    document.addEventListener('click', event => {
      const languageTarget = event.target.closest('[data-lang]');
      if (languageTarget) {
        event.preventDefault();
        setLanguage(languageTarget.getAttribute('data-lang'));
        return;
      }
      if (!event.target.closest('.lang-wrap')) closeLangMenu();

      if (event.target.closest('[data-close-modal]') || event.target.classList.contains('modal-backdrop')) {
        event.preventDefault();
        closeModal();
        return;
      }

      const actionTarget = event.target.closest('[data-action]');
      if (actionTarget) {
        const action = actionTarget.getAttribute('data-action');
        const skillId = skillIdOf(actionTarget);
        const id = actionTarget.getAttribute('data-id') || '';
        switch (action) {
          case 'do-confirm': {
            event.preventDefault();
            const callback = pendingConfirm;
            pendingConfirm = null;
            closeModal();
            if (typeof callback === 'function') callback();
            return;
          }
          case 'new-request': event.preventDefault(); requestModal(skillId); return;
          case 'skill-detail':
          case 'session-skill': event.preventDefault(); detailModal(skillId); return;
          case 'report':
          case 'session-report': event.preventDefault(); reportModal(skillId); return;
          case 'session-tab': event.preventDefault(); sessionsFilter = actionTarget.getAttribute('data-filter') || 'all'; renderApp(); return;
          case 'admin-filter': event.preventDefault(); adminFilter = actionTarget.getAttribute('data-filter') || 'open'; renderApp(); return;
          case 'reset-filters': event.preventDefault(); resetSkillFilters(); return;
          case 'wallet-topup': event.preventDefault(); topUp(); return;
          case 'reset': event.preventDefault(); openResetConfirm(); return;
          case 'session-confirm': event.preventDefault(); confirmSession(id); return;
          case 'session-complete': event.preventDefault(); completeSession(id); return;
          case 'session-cancel': event.preventDefault(); cancelSession(id); return;
          case 'session-rebook': event.preventDefault(); requestModal(skillId); return;
          case 'report-resolve': event.preventDefault(); resolveReport(id); return;
          case 'report-dismiss': event.preventDefault(); dismissReport(id); return;
          case 'report-reopen': event.preventDefault(); reopenReport(id); return;
          case 'join-room': {
            event.preventDefault();
            if (id) roomState.sessionId = id;
            navigate('room');
            return;
          }
          case 'room-toggle-timer': {
            event.preventDefault();
            toggleRoomTimer();
            return;
          }
          case 'room-reset-timer': {
            event.preventDefault();
            resetRoomTimer();
            return;
          }
          case 'room-swap-phase': {
            event.preventDefault();
            swapRoomPhase(false);
            return;
          }
          case 'room-toggle-mic': {
            event.preventDefault();
            roomState.mic = !roomState.mic;
            toast(roomState.mic ? t('room.micOff') : t('room.micOn'));
            renderApp();
            return;
          }
          case 'room-toggle-cam': {
            event.preventDefault();
            toggleRoomCamera();
            return;
          }
          case 'room-toggle-screen': {
            event.preventDefault();
            roomState.screen = !roomState.screen;
            toast(roomState.screen ? 'تم بدء مشاركة الشاشة' : 'تم إيقاف مشاركة الشاشة');
            renderApp();
            return;
          }
          case 'room-save-notes': {
            event.preventDefault();
            const notesEl = document.getElementById('roomNotesText');
            if (notesEl) roomState.notes = notesEl.value;
            toast('تم حفظ ملاحظات الجلسة بنجاح');
            return;
          }
          case 'room-end-call': {
            event.preventDefault();
            confirmAction('إنهاء جلسة التبادل؟', 'هل ترغب في إنهاء المكالمة واعتماد تبادل الوقت المتكافئ بين الطرفين؟', 'إنهاء واعتماد الوقت', () => {
              clearInterval(roomState.intervalId);
              roomState.isRunning = false;
              if (roomMediaStream) {
                roomMediaStream.getTracks().forEach(t => t.stop());
                roomMediaStream = null;
              }
              if ('speechSynthesis' in window) window.speechSynthesis.cancel();
              toast('اكتملت الجلسة بنجاح وتم تسجيل تبادل الوقت المتكافئ!', 'success');
              navigate('sessions');
            });
            return;
          }
          case 'room-play-voice': {
            event.preventDefault();
            playPartnerVoice('أهلاً بك يا سلمى! الصوت والصورة ومشاركة الشاشة واضحة تماماً، تفضلي بالشرح وأنا أتابع معك.');
            return;
          }
          case 'room-chat-tab': {
            event.preventDefault();
            roomState.activeChatTab = actionTarget.getAttribute('data-tab') || 'chat';
            renderApp();
            return;
          }
          case 'room-set-viewmode': {
            event.preventDefault();
            roomState.viewMode = actionTarget.getAttribute('data-mode') || 'focus';
            renderApp();
            return;
          }
          case 'room-focus-stream': {
            event.preventDefault();
            const stream = actionTarget.getAttribute('data-stream') || 'screen';
            roomState.focusedStream = stream;
            roomState.viewMode = 'focus';
            renderApp();
            return;
          }
          case 'room-toggle-chat': {
            event.preventDefault();
            roomState.activeChatTab = 'chat';
            renderApp();
            return;
          }
          case 'room-toggle-notes': {
            event.preventDefault();
            roomState.activeChatTab = 'notes';
            renderApp();
            return;
          }
          case 'room-toggle-deafen': {
            event.preventDefault();
            roomState.deafen = !roomState.deafen;
            toast(roomState.deafen ? 'تم كتم الصوت العام' : 'تم تشغيل الصوت العام');
            renderApp();
            return;
          }
          case 'room-add-friend': {
            event.preventDefault();
            const friendName = prompt('أدخل اسم العضو أو الزميل لإضافته:');
            if (friendName && friendName.trim()) {
              roomState.friends.push({
                id: 'f' + Date.now(),
                name: friendName.trim(),
                avatar: friendName.trim().charAt(0) || 'ع',
                status: 'online',
                role: 'مشارك جديد'
              });
              toast('تمت إضافة العضو بنجاح');
              renderApp();
            }
            return;
          }
          case 'room-send-chat-btn': {
            event.preventDefault();
            const input = document.getElementById('discordChatInput');
            if (!input || !input.value.trim()) return;
            const text = input.value.trim();
            const now = new Date();
            const timeStr = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
            roomState.chatMessages.push({
              id: 'cm' + Date.now(),
              sender: 'self',
              name: 'سلمى الزهراني',
              text: text,
              time: timeStr
            });
            input.value = '';
            renderApp();
            setTimeout(() => {
              const body = document.getElementById('discordChatBody');
              if (body) body.scrollTop = body.scrollHeight;
            }, 50);

            setTimeout(() => {
              const replyTime = new Date();
              const replyStr = String(replyTime.getHours()).padStart(2, '0') + ':' + String(replyTime.getMinutes()).padStart(2, '0');
              const replies = [
                'ممتاز جداً يا سلمى! هذا الشرح واضح ودقيق جداً.',
                'تمام، أنا أتابع معك على شاشة العرض مباشرة.',
                'سؤال سريع بخصوص هذه النقطة، هل يمكنك توضيحها أكثر في الشوط القادم؟',
                'الفكرة ممتازة وتطبيقي جاهز لنتبادل الأدوار عند انتهاء هذا الشوط.'
              ];
              const randomReply = replies[Math.floor(Math.random() * replies.length)];
              roomState.chatMessages.push({
                id: 'cm' + Date.now(),
                sender: 'peer',
                name: 'عمر خالد',
                text: randomReply,
                time: replyStr
              });
              renderApp();
              playPartnerVoice(randomReply);
              setTimeout(() => {
                const b = document.getElementById('discordChatBody');
                if (b) b.scrollTop = b.scrollHeight;
              }, 50);
            }, 1000);
            return;
          }
          default: return;
        }
      }

        const goTarget = event.target.closest('[data-go]');
      if (goTarget) {
        event.preventDefault();
        if (document.getElementById('modalRoot').innerHTML.trim()) closeModal();
        navigate(goTarget.getAttribute('data-go'));
        window.scrollTo({ top: 0, behavior: 'auto' });
        return;
      }

      if (event.target.closest('#menuToggle')) {
        event.preventDefault();
        openSidebar();
        return;
      }
      if (event.target.closest('#sidebarClose') || event.target.closest('#sidebarBackdrop')) {
        event.preventDefault();
        closeSidebar();
      }
    });

    document.addEventListener('input', event => {
      if (event.target.id === 'skillSearch') {
        filters.search = event.target.value;
        updateSkillsResults();
      }
    });
    document.addEventListener('change', event => {
      const id = event.target.id;
      if (id === 'skillCategory') { filters.category = event.target.value; updateSkillsResults(); }
      if (id === 'skillLevel') { filters.level = event.target.value; updateSkillsResults(); }
      if (id === 'skillSort') { filters.sort = event.target.value; updateSkillsResults(); }
      if (event.target.closest('#requestForm')) updateRequestSummary();
    });
    document.addEventListener('submit', event => {
      const form = event.target.closest('form[data-form]');
      if (!form) return;
      event.preventDefault();
      if (form.dataset.form === 'request') submitRequestForm(form);
      if (form.dataset.form === 'report') submitReportForm(form);
    });
    document.addEventListener('keydown', event => {
      if (event.key !== 'Escape') return;
      if (document.getElementById('modalRoot').innerHTML.trim()) { closeModal(); return; }
      if (!document.getElementById('langMenu').hidden) { closeLangMenu(); document.getElementById('langButton').focus(); return; }
      closeSidebar();
    });
    window.addEventListener('hashchange', () => {
      route = routeFromHash();
      closeSidebar();
      closeLangMenu();
      closeModal();
      renderApp();
      window.scrollTo({ top: 0, behavior: 'auto' });
    });
    window.addEventListener('resize', () => {
      if (window.innerWidth > 960) closeSidebar();
    });

    function initApp() {
      if (!location.hash) {
        try { history.replaceState(null, '', '#/home'); } catch (error) { /* hash navigation still works */ }
      }
      route = routeFromHash();
      closeSidebar();
      closeLangMenu();
      syncChrome();
      renderApp();
    }
    initApp();
  </script>
</body>
</html>
